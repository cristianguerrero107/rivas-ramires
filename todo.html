<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>To-Do List - Gestor de Tareas</title>
	<link rel="stylesheet" type="text/css" href="todo.css">
</head>
<body>
	<div class="container">
		<div class="todo-wrapper">
			<h1>Mi Lista de Tareas</h1>
			
			<div class="input-section">
				<input 
					type="text" 
					id="taskInput" 
					class="task-input" 
					placeholder="Añade una nueva tarea..."
					autocomplete="off"
				>
				<button id="addBtn" class="add-btn">Añadir</button>
			</div>

			<div class="filter-buttons">
				<button class="filter-btn active" data-filter="all">Todas</button>
				<button class="filter-btn" data-filter="active">Activas</button>
				<button class="filter-btn" data-filter="completed">Completadas</button>
			</div>

			<ul id="taskList" class="task-list">
				<!-- Las tareas se añadirán aquí dinámicamente -->
			</ul>

			<div class="task-stats">
				<span>Total: <span id="totalTasks">0</span></span>
				<span>Completadas: <span id="completedTasks">0</span></span>
				<button id="clearBtn" class="clear-btn">Limpiar Completadas</button>
			</div>
		</div>
	</div>

	<script src="todo.js"></script>
</body>
</html>
